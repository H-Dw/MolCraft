# Interface example: replace the sequence and pocket with the actual target.
# Paths are POSIX paths. No command downloads checkpoints or CCD resources.
proteins:
  - chain_id: A
    sequence: ACDEFGHIKLMNPQRSTVWY
    msa_path: null
ligand:
  chain_id: L
  smiles: CCC
pocket:
  - {chain_id: A, position: 2}
  - {chain_id: A, position: 5}
model_paths:
  structure_checkpoint: /models/boltz/boltz2_conf.ckpt
  affinity_checkpoint: /models/boltz/boltz2_aff.ckpt
  ccd_path: /models/boltz/ccd.pkl
  molecule_dir: /models/boltz/mols
objective:
  affinity_weight: 1.0
  contact_weight: 2.5
  confidence_weight: 2.5
  geometry_weight: 1.0
  contact_cutoff: 8.0
  geometry_cutoff: 6.0
  softmin_temperature: 0.5
  clash_scale: 0.75
proposal:
  temperature: 1.0
  per_channel: 32
  max_proposals: 256
  max_candidates: 32
  max_bundle_size: 2
run:
  gradient_mode: through_structure
  sampling_steps: 25
  trunk_passes: 1
  seed: 0
